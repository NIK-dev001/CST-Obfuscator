<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CST // Obfuscator Tool</title>
    <style>
        :root {
            --bg-body: #ffffff;
            --bg-sidebar: #f7f9fc;
            --border: #e1e4e8;
            --text-primary: #24292e;
            --text-secondary: #586069;
            --accent: #0366d6; /* GitHub Blue style */
            --code-bg: #f6f8fa;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }

        /* Dark Mode Support based on system preference */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #0d1117;
                --bg-sidebar: #161b22;
                --border: #30363d;
                --text-primary: #c9d1d9;
                --text-secondary: #8b949e;
                --accent: #58a6ff;
                --code-bg: #21262d;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }

        body {
            font-family: var(--font-ui);
            background: var(--bg-body);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
            font-size: 14px;
            line-height: 1.5;
        }

        /* SIDEBAR */
        aside {
            width: 260px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand {
            font-weight: 600;
            font-size: 16px;
            color: var(--text-primary);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .brand span { color: var(--text-secondary); font-weight: 400; }

        .nav-group { margin-bottom: 24px; }
        .nav-label {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .info-block {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* MAIN CONTENT */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .header {
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { font-size: 24px; font-weight: 500; }

        .editor-container {
            display: flex;
            gap: 24px;
            flex: 1;
            min-height: 0; /* Fix flex overflow */
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-body);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
        }

        .panel-header {
            padding: 8px 16px;
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        textarea {
            flex: 1;
            width: 100%;
            border: none;
            resize: none;
            padding: 16px;
            font-family: var(--font-mono);
            font-size: 13px;
            background: transparent;
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* BUTTONS */
        .btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            font-family: var(--font-ui);
        }

        .btn:hover { background: var(--bg-sidebar); border-color: var(--text-secondary); }
        
        .btn-primary {
            background: var(--accent);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-primary:hover { opacity: 0.9; background: var(--accent); border-color: transparent; }

        .actions {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn-lg {
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
        }

        /* UTILS */
        .hidden { display: none; }
    </style>
</head>
<body>

    <aside>
        <div>
            <div class="brand">CST <span>Obfuscator</span></div>
            
            <div class="nav-group">
                <div class="nav-label">Algorithm Info</div>
                <div class="info-block">
                    <p><strong>Type:</strong> Transposition + Noise</p>
                    <p><strong>Charset:</strong> Unicode (UTF-16)</p>
                    <p><strong>Noise:</strong> Randomized (5 chars)</p>
                </div>
            </div>

            <div class="nav-group">
                <div class="nav-label">Support</div>
                <div class="info-block">
                    Supports all languages including CJK, Cyrillic, and Emojis.
                </div>
            </div>
        </div>

        <div class="info-block">
            v1.0.0 &copy; NIK-dev
        </div>
    </aside>

    <main>
        <div class="header">
            <h1>Workspace</h1>
        </div>

        <div class="editor-container">
            <!-- Input Panel -->
            <div class="panel">
                <div class="panel-header">
                    <span>INPUT</span>
                    <button class="btn" onclick="clearInput()">Clear</button>
                </div>
                <textarea id="input" placeholder="Type or paste text here..."></textarea>
            </div>

            <!-- Output Panel -->
            <div class="panel">
                <div class="panel-header">
                    <span>OUTPUT</span>
                    <button class="btn" onclick="copyOutput()">Copy Result</button>
                </div>
                <textarea id="output" readonly placeholder="Result will appear here..."></textarea>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-lg" onclick="process('encrypt')">Obfuscate (Encrypt)</button>
            <button class="btn btn-lg" onclick="process('decrypt')">Restore (Decrypt)</button>
        </div>
    </main>

    <script>
        /**
         * CST Core Logic
         */
        const CST = {
            config: {
                separator: '|',
                noiseLength: 5,
                charset: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()'
            },

            _generateNoise: function() {
                let result = '';
                const chars = this.config.charset;
                for (let i = 0; i < this.config.noiseLength; i++) {
                    result += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return result;
            },

            _encryptWord: function(word) {
                if (!word) return "";
                let arr = Array.from(word);
                let len = arr.length;

                if (len >= 3) [arr[0], arr[2]] = [arr[2], arr[0]];
                if (len >= 6) [arr[2], arr[5]] = [arr[5], arr[2]];
                
                arr.reverse();
                return arr.join('') + this.config.separator + this._generateNoise();
            },

            _decryptWord: function(codeWord) {
                const sepIndex = codeWord.lastIndexOf(this.config.separator);
                if (sepIndex === -1) return codeWord;

                let core = codeWord.substring(0, sepIndex);
                let arr = Array.from(core);
                let len = arr.length;

                arr.reverse();
                if (len >= 6) [arr[2], arr[5]] = [arr[5], arr[2]];
                if (len >= 3) [arr[0], arr[2]] = [arr[2], arr[0]];

                return arr.join('');
            },

            encrypt: function(text) {
                return text.split(' ').map(w => this._encryptWord(w)).join(' ');
            },

            decrypt: function(text) {
                return text.split(' ').map(w => this._decryptWord(w)).join(' ');
            }
        };

        // UI Logic
        const inputEl = document.getElementById('input');
        const outputEl = document.getElementById('output');

        function process(action) {
            const text = inputEl.value;
            if (!text) return;

            if (action === 'encrypt') {
                outputEl.value = CST.encrypt(text);
            } else {
                outputEl.value = CST.decrypt(text);
            }
        }

        function clearInput() {
            inputEl.value = '';
            outputEl.value = '';
            inputEl.focus();
        }

        function copyOutput() {
            if (!outputEl.value) return;
            outputEl.select();
            document.execCommand('copy');
            
            // Visual feedback
            const btn = document.querySelector('.panel-header button');
            const originalText = btn.innerText;
            btn.innerText = "Copied!";
            setTimeout(() => btn.innerText = originalText, 1500);
        }
    </script>
</body>
</html>
